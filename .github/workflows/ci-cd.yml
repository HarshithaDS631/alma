name: Alumni App CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Frontend Web Build
        run: npm run build

      - name: Install Backend Dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Test Backend Models & Controllers Syntax
        run: |
          cd backend
          node -e "require('./models/User.js'); require('./controllers/authController.js'); require('./controllers/postController.js'); console.log('Backend syntax clean!');"

