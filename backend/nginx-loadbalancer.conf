# ==============================================================================
# Alumni Network Platform - Production Nginx Load Balancer & Reverse Proxy
# ==============================================================================
# Features:
# - Layer 7 HTTP & WebSocket Load Balancing with Least Connections / Round-Robin
# - Anti-Bot & Scraper Firewall (blocks automated vulnerability scanners)
# - Rate Limiting & DDOS Mitigation (burst allowance with delayed rejection)
# - Real IP Header Preservation for Accurate IP-based Lockouts
# - Zero-Downtime Health Checks & Seamless Failover
# ==============================================================================

# Rate limiting zones:
# 1. General API limit: 25 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=25r/s;
# 2. Strict Authentication limit: 5 requests/minute per IP (Anti-Brute-Force & Bot Defense)
limit_req_zone $binary_remote_addr zone=auth_strict_limit:10m rate=5r/m;

# Upstream Backend Cluster Pool
# When running multiple backend worker processes or servers across ports/hosts:
upstream alumni_backend_cluster {
    # Method: least_conn directs traffic to worker with fewest active connections
    least_conn;

    # Primary Node.js Cluster instance (internal cluster distributes across CPU cores)
    server 127.0.0.1:5000 max_fails=3 fail_timeout=15s;
    
    # Additional server instances can be enabled when scaling horizontally:
    # server 127.0.0.1:5001 max_fails=3 fail_timeout=15s;
    # server 127.0.0.1:5002 max_fails=3 fail_timeout=15s;
    # server 127.0.0.1:5003 max_fails=3 fail_timeout=15s;

    keepalive 64;
}

# Bot Protection Map: Identify malicious bots and scanners by User-Agent
map $http_user_agent $is_malicious_bot {
    default 0;
    ~*(sqlmap|nikto|masscan|dirbuster|nmap|zgrab|gobuster|wpscan|hydra|acunetix|nessus) 1;
    ~*(burpcollaborator|shodan|censys|openvas|python-requests|aiohttp|go-http-client) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name alumni.yourdomain.com api-alumni.yourdomain.com localhost;

    # Redirect all plain HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    # Maximum allowed request body size (prevents memory exhaustion from huge payloads)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65;
    send_timeout 15s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Global Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Load-Balancer "Alumni-Nginx-Cluster-V1" always;

    # 1. Anti-Bot Filter: Drop detected bot scanners immediately with HTTP 403
    if ($is_malicious_bot = 1) {
        return 403 '{"error": "Access Denied: Automated bot activity detected."}\n';
    }

    # 2. Authentication Routes: High-Security Strict Rate Limiting
    location ~* ^/(api/auth/login|api/v1/auth/login|api/auth/register|api/v1/auth/register) {
        limit_req zone=auth_strict_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://alumni_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 3. WebSocket / Socket.IO Real-Time Traffic
    location /socket.io/ {
        proxy_pass http://alumni_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # 4. CAPTCHA Security Endpoints
    location ~* ^/(api/auth/captcha|api/v1/auth/captcha) {
        proxy_pass http://alumni_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Never cache security challenges
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # 5. General API Gateway
    location /api/ {
        limit_req zone=api_general_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://alumni_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 6. Load Balancer Health Check
    location /health {
        proxy_pass http://alumni_backend_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Default fallback
    location / {
        proxy_pass http://alumni_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
